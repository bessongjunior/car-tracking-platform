<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1350" viewBox="0 0 1220 1350" style="background-color: #FFFFFF; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow for Lifeline Boxes -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="gpsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="espGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <linearGradient id="rtdbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="fcmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E293B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Title Section -->
  <rect x="0" y="0" width="1220" height="90" fill="#F8FAFC" border-bottom="1px solid #E2E8F0"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#1E293B">UML SEQUENCE DIAGRAM — DEVICE TELEMETRY &amp; TRACKING FLOW</text>
  <text x="30" y="65" font-size="14" fill="#64748B">Real-time Location Ingestion, Database persistence, Firebase live sync, Geofence evaluation, and Push notifications</text>

  <!-- Group Frame Alert Condition -->
  <rect x="25" y="750" width="1170" height="280" rx="8" fill="#FEF2F2" fill-opacity="0.4" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="25" y="750" width="300" height="25" rx="4" fill="#EF4444" />
  <text x="35" y="767" font-size="11" font-weight="bold" fill="#FFFFFF">OPTIONAL: GEOFENCE BREACH / OVERSPEED DETECTED</text>

  <!-- Lifelines (vertical lines) -->
  <!-- Neo-7M GPS (80) -->
  <line x1="80" y1="210" x2="80" y2="1280" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.5"/>
  <!-- ESP8266 Microcontroller (230) -->
  <line x1="230" y1="210" x2="230" y2="1280" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.5"/>
  <!-- Flask Backend (430) -->
  <line x1="430" y1="210" x2="430" y2="1280" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.5"/>
  <!-- PostgreSQL Database (630) -->
  <line x1="630" y1="210" x2="630" y2="1280" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.5"/>
  <!-- Firebase Realtime DB (810) -->
  <line x1="810" y1="210" x2="810" y2="1280" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.5"/>
  <!-- Firebase FCM (980) -->
  <line x1="980" y1="210" x2="980" y2="1280" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.5"/>
  <!-- Flutter Client (1140) -->
  <line x1="1140" y1="210" x2="1140" y2="1280" stroke="#94A3B8" stroke-dasharray="6 4" stroke-width="1.5"/>

  <!-- Activation Bars -->
  <!-- Neo-7M GPS -->
  <rect x="74" y="210" width="12" height="60" rx="2" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
  <!-- ESP8266 -->
  <rect x="224" y="220" width="12" height="120" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <rect x="224" y="1120" width="12" height="40" rx="2" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1"/>
  <!-- Flask Backend -->
  <rect x="424" y="320" width="12" height="800" rx="2" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <!-- PostgreSQL DB -->
  <rect x="624" y="340" width="12" height="150" rx="2" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/>
  <rect x="624" y="620" width="12" height="60" rx="2" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/>
  <rect x="624" y="780" width="12" height="120" rx="2" fill="#F3F4F6" stroke="#4B5563" stroke-width="1"/>
  <!-- Firebase RTDB -->
  <rect x="804" y="520" width="12" height="70" rx="2" fill="#FEF3C7" stroke="#D97706" stroke-width="1"/>
  <!-- FCM -->
  <rect x="974" y="930" width="12" height="70" rx="2" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <!-- Flutter Client -->
  <rect x="1134" y="550" width="12" height="50" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
  <rect x="1134" y="980" width="12" height="70" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>


  <!-- Header Boxes (Lifeline Labels) -->
  <!-- Neo-7M GPS -->
  <g transform="translate(10, 160)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#gpsGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Neo-7M GPS</text>
  </g>

  <!-- ESP8266 -->
  <g transform="translate(160, 160)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#espGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">ESP8266 MCU</text>
  </g>

  <!-- Flask Backend -->
  <g transform="translate(360, 160)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#backendGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Flask Backend</text>
  </g>

  <!-- PostgreSQL Database -->
  <g transform="translate(560, 160)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#dbGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">PostgreSQL DB</text>
  </g>

  <!-- Firebase RTDB -->
  <g transform="translate(740, 160)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#rtdbGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Firebase RTDB</text>
  </g>

  <!-- Firebase FCM -->
  <g transform="translate(910, 160)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#fcmGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Google FCM</text>
  </g>

  <!-- Flutter Client -->
  <g transform="translate(1070, 160)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#clientGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Flutter Client</text>
  </g>


  <!-- Messages and Operations -->
  
  <!-- 1. Emits NMEA sentences -->
  <line x1="80" y1="230" x2="224" y2="230" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="152" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">1. NMEA 0183 (Doppler ground speed, $GPRMC)</text>

  <!-- 2. Parses NMEA -->
  <path d="M 236 250 C 270 250, 270 280, 236 280" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="250" y="269" text-anchor="start" font-size="10" fill="#7C3AED">2. TinyGPS++ parses coordinates, speed &amp; sat</text>

  <!-- 3. HTTPS POST /telemetry -->
  <line x1="236" y1="320" x2="424" y2="320" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="330" y="312" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">3. POST /api/v1/telemetry (Auth: X-Device-Key)</text>

  <!-- 4. Query Device -->
  <line x1="436" y1="350" x2="624" y2="350" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="342" text-anchor="middle" font-size="10" fill="#4B5563">4. Authenticate key &amp; resolve Vehicle</text>

  <!-- 5. Return details -->
  <line x1="624" y1="385" x2="436" y2="385" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>
  <text x="530" y="377" text-anchor="middle" font-size="10" fill="#4B5563">5. Return device config &amp; assigned vehicle</text>

  <!-- 6. Insert Telemetry -->
  <line x1="436" y1="420" x2="624" y2="420" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="412" text-anchor="middle" font-size="10" fill="#4B5563">6. Persist Telemetry row &amp; update vehicle heartbeat</text>

  <!-- 7. Push to Firebase RTDB -->
  <line x1="436" y1="525" x2="804" y2="525" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="517" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97706">7. Write GPS state to /vehicles/{id}/gps</text>

  <!-- 8. Real-time broadcast -->
  <line x1="816" y1="565" x2="1134" y2="565" stroke="#D97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="975" y="557" text-anchor="middle" font-size="10" font-weight="bold" fill="#D97706">8. Sync Stream: onValue triggers location update</text>

  <!-- 9. Query Geofences -->
  <line x1="436" y1="630" x2="624" y2="630" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="622" text-anchor="middle" font-size="10" fill="#4B5563">9. Fetch active geofences for Organization</text>

  <!-- 10. Geofences list -->
  <line x1="624" y1="665" x2="436" y2="665" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>
  <text x="530" y="657" text-anchor="middle" font-size="10" fill="#4B5563">10. Return geofence geometries &amp; speed limits</text>

  <!-- 11. Internal: Evaluate Geofence/Speed -->
  <path d="M 436 690 C 470 690, 470 720, 436 720" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="450" y="709" text-anchor="start" font-size="10" fill="#059669">11. Evaluate: Haversine/Ray-casting &amp; Speed limit checks</text>


  <!-- Optional alert flow -->
  <!-- 12. Create Alert -->
  <line x1="436" y1="800" x2="624" y2="800" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="530" y="792" text-anchor="middle" font-size="10" fill="#DC2626">12. Insert Alert row ('geofence' or 'speed')</text>

  <!-- 13. Fetch FCM Tokens -->
  <line x1="436" y1="840" x2="624" y2="840" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="832" text-anchor="middle" font-size="10" fill="#4B5563">13. Query registered user FCM tokens for organisation</text>

  <!-- 14. Return tokens -->
  <line x1="624" y1="875" x2="436" y2="875" stroke="#4B5563" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>
  <text x="530" y="867" text-anchor="middle" font-size="10" fill="#4B5563">14. Return FCM token list</text>

  <!-- 15. Send Multicast -->
  <line x1="436" y1="945" x2="974" y2="945" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="705" y="937" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">15. Dispatch FCM multicast request</text>

  <!-- 16. FCM Delivery -->
  <line x1="986" y1="990" x2="1134" y2="990" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="1060" y="982" text-anchor="middle" font-size="10" font-weight="bold" fill="#DC2626">16. Push notification (background/foreground)</text>

  <!-- 17. Client updates -->
  <path d="M 1146 1010 C 1180 1010, 1180 1040, 1146 1040" fill="none" stroke="#0284C7" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="1160" y="1029" text-anchor="start" font-size="10" fill="#0284C7">17. Rotate marker, update speed indicator, show notification</text>

  <!-- 18. HTTP 201 Response -->
  <line x1="424" y1="1130" x2="236" y2="1130" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-dashed)"/>
  <text x="330" y="1122" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563EB">18. HTTP 201 Created {telemetry_id}</text>

  <!-- 19. Clear buffer -->
  <path d="M 224 1140 C 190 1140, 190 1170, 224 1170" fill="none" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="180" y="1159" text-anchor="end" font-size="10" fill="#7C3AED">19. Delete processed record from SPIFFS flash buffer</text>


  <!-- Footer Boxes (Lifeline Labels) -->
  <!-- Neo-7M GPS -->
  <g transform="translate(10, 1290)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#gpsGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Neo-7M GPS</text>
  </g>

  <!-- ESP8266 -->
  <g transform="translate(160, 1290)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#espGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">ESP8266 MCU</text>
  </g>

  <!-- Flask Backend -->
  <g transform="translate(360, 1290)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#backendGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Flask Backend</text>
  </g>

  <!-- PostgreSQL Database -->
  <g transform="translate(560, 1290)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#dbGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">PostgreSQL DB</text>
  </g>

  <!-- Firebase RTDB -->
  <g transform="translate(740, 1290)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#rtdbGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Firebase RTDB</text>
  </g>

  <!-- Firebase FCM -->
  <g transform="translate(910, 1290)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#fcmGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Google FCM</text>
  </g>

  <!-- Flutter Client -->
  <g transform="translate(1070, 1290)" filter="url(#shadow)">
    <rect width="140" height="40" rx="6" fill="url(#clientGrad)"/>
    <text x="70" y="25" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Flutter Client</text>
  </g>

</svg>
